services:
  web:
    build: .
    image: yoloe-counting:latest
    container_name: yoloe-counting
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app   # bind para iterar sin rebuild
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
